[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "panicmeter"
version = "0.1.0"
description = "Measure stress/panic from coding behavior: rewrites, reverts, debug thrashing, freezes."
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
panicmeter = "panicmeter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
